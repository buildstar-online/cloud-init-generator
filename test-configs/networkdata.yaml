renderer: networkd
network:
  version: 2
  ethernets:
    multus:
      match:
        macaddress: ${MACADDRESS}
      dhcp4: false
      dhcp6: false
      addresses:
        - 192.168.100.100/24
      routes:
        - to: default
          via: 192.168.100.1
      mtu: 1500
      nameservers:
        addresses:
          - 192.168.100.1
